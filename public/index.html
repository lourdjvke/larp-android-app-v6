<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#FAF8F5">
  <title>Abadon</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #FAF8F5;
      color: #1F1E1D;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    .hud {
      position: absolute;
      top: env(safe-area-inset-top, 20px);
      left: 20px;
      right: 20px;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }
    .title {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #1F1E1D;
    }
    .controls {
      position: absolute;
      bottom: env(safe-area-inset-bottom, 24px);
      left: 20px;
      right: 20px;
      z-index: 10;
      display: flex;
      gap: 10px;
    }
    .glass-btn {
      flex: 1;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 0, 0, 0.1);
      color: #1F1E1D;
      padding: 14px;
      border-radius: 14px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div class="title">ABADON · LIGHT</div>
    <div style="font-size: 0.8rem; opacity: 0.7;">LIGHT MODE</div>
  </div>

  <canvas id="c"></canvas>

  <div class="controls">
    <button class="glass-btn" onclick="pulse()">Burst Kinetic Pulse</button>
    <button class="glass-btn" onclick="toggleColor()">Shift Color</button>
  </div>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const particles = [];
    const colors = ['#D97757', '#2563EB', '#059669', '#7C3AED'];
    let currentColor = colors[0];

    for (let i = 0; i < 60; i++) {
      particles.push({
        x: Math.random() * width,
        y: Math.random() * height,
        vx: (Math.random() - 0.5) * 1.5,
        vy: (Math.random() - 0.5) * 1.5,
        radius: Math.random() * 3 + 1.5
      });
    }

    function animate() {
      ctx.fillStyle = 'rgba(250, 248, 245, 0.2)';
      ctx.fillRect(0, 0, width, height);

      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        if (p.x < 0 || p.x > width) p.vx *= -1;
        if (p.y < 0 || p.y > height) p.vy *= -1;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = currentColor;
        ctx.fill();
      });

      requestAnimationFrame(animate);
    }
    animate();

    function pulse() {
      if (window.LarpBridge) {
        window.LarpBridge.haptic('HEAVY');
      }
      particles.forEach(p => {
        p.vx = (Math.random() - 0.5) * 6;
        p.vy = (Math.random() - 0.5) * 6;
      });
    }

    let colIdx = 0;
    function toggleColor() {
      colIdx = (colIdx + 1) % colors.length;
      currentColor = colors[colIdx];
      if (window.LarpBridge) {
        window.LarpBridge.setThemeColor(currentColor);
      }
    }
  </script>
</body>
</html>
